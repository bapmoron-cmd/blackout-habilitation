function makeExam(p){let cfg=CONFIG.profiles.find(x=>x.id===p),n=cfg.count,pool=BANK.filter(q=>q.profiles.includes(p)),ids=[];for(const [k,c] of [['ZE',Math.ceil(n*.3)],['L',Math.ceil(n*.3)],['A',Math.max(2,Math.floor(n/10))],['D',1]])ids.push(...shuffle(pool.filter(q=>theme(q)===k)).slice(0,c));if(ids.length>n)ids=ids.slice(0,n);ids.push(...shuffle(pool.filter(q=>!ids.includes(q))).slice(0,n-ids.length));if(ids.length!==n)throw Error('Banque insuffisante.');if(!ids.some(q=>CRITICAL.has(q.id))){let critical=shuffle(pool.filter(q=>CRITICAL.has(q.id)))[0];if(critical){let j=ids.findIndex(q=>theme(q)===theme(critical));if(j<0)j=ids.length-1;ids[j]=critical}}let questions=shuffle(ids).map(q=>({id:q.id,question:q.question,theme:th[theme(q)],options:shuffle(q.options).map(o=>({index:o.index,text:o.text}))}));let start=now();return {profile:p,questions,ids:questions.map(q=>q.id),answers:{},start,end:start+cfg.minutes*60}}
function finishLocal(){let e=model.exam;if(!e)return;let good=0,critical=[],errors=[],themes={},details=[];for(let id of e.ids){let q=byId[id],k=theme(q),a=e.answers[id]||[],b=q.options.filter(o=>o.correct).map(o=>o.index),ok=a.length===b.length&&b.every(v=>a.includes(v));details.push({id,question:q.question,theme:k,critical:CRITICAL.has(id),ok,displayOrder:e.questions.find(x=>x.id===id).options.map(o=>o.index),selectedIndices:[...a],expectedIndices:[...b],selected:q.options.filter(o=>a.includes(o.index)).map(o=>o.text),expected:q.options.filter(o=>o.correct).map(o=>o.text)});themes[k]??=[0,0];themes[k][1]++;if(ok){good++;themes[k][0]++}else{errors.push(id);if(CRITICAL.has(id))critical.push(id)}}let total=e.ids.length,score=100*good/total;model.results[e.profile]={profile:e.profile,good,total,score:Math.round(score*100)/100,passed:score>=80&&!critical.length&&Object.values(themes).every(([a,b])=>a/b>=.7),critical,errors,themes,details,seconds:Math.max(0,Math.floor(Math.min(now(),e.end)-e.start)),date:new Date(Math.min(now(),e.end)*1000).toLocaleString('fr-FR'),answered:Object.values(e.answers).filter(a=>a.length).length};model.exam=null;save()}

async function api(path,data={}){if(path==='create'){model={id:'HE-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(),identity:{nom:data.nom.trim(),prenom:data.prenom.trim(),classe:data.classe.trim()},path:data.path,results:{},exam:null};if(!model.path.length||!Object.values(model.identity).every(Boolean))throw Error('Renseignez votre identité et sélectionnez une épreuve.');save();return {token:'local',state:publicState()}}if(!model)throw Error('Session absente.');tick();if(path==='start'){if(model.exam||model.path.find(p=>!model.results[p])!==data.profile)throw Error('Épreuve non disponible.');model.exam=makeExam(data.profile)}else if(path==='answer'){if(!model.exam||!model.exam.ids.includes(data.id))return publicState();model.exam.answers[data.id]=data.values}else if(path==='finish'){finishLocal()}save();return publicState()}
const CORRECTION_ONLY=new Set(['A02','ZE08','ZE12','ZE17','ZE19','ZE20','ZE21','L45']);function figure(id,review=false){if(!review&&CORRECTION_ONLY.has(id))return '';let f=IMAGES[IMAGE_MAP[id]];return f?`<figure class="illustration"><img src="${f.src}" alt="Illustration technique de contexte" onclick="this.classList.toggle('zoom')"><figcaption>${review?esc(f.caption):'Illustration de contexte · Livret PROMEO'} · Cliquer pour agrandir</figcaption></figure>`:''}

function landing(){layout(`<div class="tag">01 / Identification</div><h1>Votre parcours d’habilitation</h1><p class="muted">Chaque épreuve possède son propre chronomètre. Les réponses sont enregistrées au fur et à mesure. Un seul bilan PDF récapitule toutes les épreuves choisies, même en cas d’échec.</p><form id="form"><section class="panel"><h2>Informations apprenti</h2><div class="identity"><label>Nom<input name="nom" type="text" maxlength="80" required></label><label>Prénom<input name="prenom" type="text" maxlength="80" required></label><label>Classe / formation<input name="classe" type="text" maxlength="80" required></label></div></section><section class="panel"><div class="row"><h2>Habilitations à passer</h2><button type="button" id="all">Tout sélectionner</button></div><div class="grid">${config.profiles.map(p=>`<label class="checktile"><input type="checkbox" name="path" value="${esc(p.id)}"><span><b>${esc(p.name)}</b><br><small>${p.count} questions · ${p.minutes} min</small></span></label>`).join('')}</div><p id="estimate" class="muted">Sélectionnez les épreuves demandées par votre formateur.</p></section><p class="notice">Résultat pédagogique : au moins 80 % au total, 70 % dans chaque thème évalué et aucune erreur sur les questions critiques sélectionnées. Le temps continue en cas de fermeture de la page.</p><button type="submit" class="primary">Créer mon parcours</button></form>`);let f=$('form');function estimate(){let chosen=config.profiles.filter(p=>[...f.querySelectorAll('input[name=path]:checked')].some(c=>c.value===p.id));$('estimate').textContent=chosen.length?`${chosen.length} épreuves · ${chosen.reduce((s,p)=>s+p.minutes,0)} minutes maximum`:'Sélectionnez les épreuves demandées par votre formateur.'}f.onchange=estimate;$('all').onclick=()=>{let cs=[...f.querySelectorAll('input[name=path]')];let v=!cs.every(c=>c.checked);cs.forEach(c=>c.checked=v);estimate()};f.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{let fd=new FormData(f);let j=await api('create',{nom:fd.get('nom'),prenom:fd.get('prenom'),classe:fd.get('classe'),path:fd.getAll('path')});token=j.token;update(j.state)}catch(e){error(e)}finally{busy=false}}}
function dashboard(){if(state.path.every(p=>state.results[p]))return finalDashboardV3();let rs=Object.values(state.results),done=rs.length,total=state.path.length,passed=rs.filter(r=>r.passed).length,p=state.path.find(p=>!state.results[p]);let latest=rs.at(-1);layout(`<div class="tag">${p?'02 / Parcours':'03 / Bilan final'}</div><h1>${p?'Évaluations individuelles':'Parcours terminé'}</h1><p class="muted">${esc(state.identity.prenom)} ${esc(state.identity.nom)} · ${esc(state.identity.classe)} · ${esc(state.id)}</p><div class="grid"><div class="panel"><small>Épreuves terminées</small><div class="metric">${done}/${total}</div></div><div class="panel"><small>Réussies</small><div class="metric ok">${passed}</div></div><div class="panel"><small>Non réussies</small><div class="metric bad">${done-passed}</div></div></div>${latest?`<div class="panel"><div class="tag">Dernier résultat</div><h2>${esc(name(latest.profile))} — <span class="${latest.passed?'ok':'bad'}">${latest.passed?'THÉORIE RÉUSSIE':'THÉORIE NON RÉUSSIE'}</span></h2><p>${latest.good}/${latest.total} · ${latest.score} % · ${fmt(latest.seconds)} · ${latest.critical.length} erreur(s) critique(s)</p><div class="grid">${Object.entries(latest.themes).map(([k,v])=>`<div><small>${th[k]}</small><h3>${Math.round(100*v[0]/v[1])} %</h3><div class="progress"><i style="width:${100*v[0]/v[1]}%"></i></div></div>`).join('')}</div></div>`:''}<div class="panel tablewrap"><h2>Résultats du parcours</h2><table><thead><tr><th>Épreuve</th><th>Score</th><th>Temps</th><th>Erreurs critiques</th><th>Statut</th></tr></thead><tbody>${state.path.map(h=>{let r=state.results[h];return `<tr><td>${esc(name(h))}</td><td>${r?r.score+' %':'—'}</td><td>${r?fmt(r.seconds):'—'}</td><td>${r?r.critical.length:'—'}</td><td class="${r?(r.passed?'ok':'bad'):'muted'}">${r?(r.passed?'Réussie':'Non réussie'):'À passer'}</td></tr>`}).join('')}</tbody></table></div>${p?`<section class="panel"><h2>Prochaine épreuve : ${esc(name(p))}</h2><p>Le chronomètre démarre au clic. Il n'est pas possible de suspendre l’épreuve.</p><button class="primary" id="start">Commencer l’épreuve</button></section>`:`<section class="panel"><h2>Générer mon bilan PDF</h2><p>Le fichier comprend toutes vos épreuves et les résultats détaillés. Téléchargez-le puis envoyez-le vous-même par mail à votre formateur.</p><button class="primary" id="pdf">Télécharger mon bilan PDF</button> <button id="print">Imprimer / PDF avec mise en page</button><p class="muted">Objet conseillé : Résultats habilitations électriques – ${esc(state.identity.nom)} ${esc(state.identity.prenom)} – ${esc(state.identity.classe)}</p></section>${corrections()}`}`);if(p)$('start').onclick=()=>action('start',{profile:p});else {$('pdf').onclick=()=>{try{pdfLocal()}catch(e){error(e)}};$('print').onclick=()=>{document.querySelectorAll('details').forEach(d=>d.open=true);window.print()}}}
function exam(){let e=state.exam,q=e.questions[index],selected=e.answers[q.id]||[],n=e.questions.length,count=Object.values(e.answers).filter(v=>v.length).length;layout(`<div class="row"><div><div class="tag">Épreuve en cours</div><h1>${esc(name(e.profile))}</h1></div><span class="muted">${count}/${n} réponses enregistrées</span></div><div class="progress"><i style="width:${count/n*100}%"></i></div><div class="layout"><section class="panel"><div class="row"><span class="tag">${esc(q.theme)} / ${esc(q.id)}</span><small>Question ${index+1} / ${n}</small></div>${CRITICAL.has(q.id)?`<div class="critical" role="note">⚠ QUESTION CRITIQUE <span>Une erreur invalide cette épreuve.</span></div>`:''}<h2>${esc(q.question)}</h2>${figure(q.id)}<p class="muted">Sélectionnez toutes les réponses correctes.</p>${q.options.map((o,j)=>`<button class="option ${selected.includes(o.index)?'on':''}" data-id="${o.index}" aria-pressed="${selected.includes(o.index)}"><b>${selected.includes(o.index)?'✓':String.fromCharCode(65+j)}</b><span>${esc(o.text)}</span></button>`).join('')}<div class="row" style="margin-top:24px"><button id="prev" ${index===0?'disabled':''}>← Précédente</button><button id="next" class="primary" ${index===n-1?'disabled':''}>Suivante →</button></div></section><aside class="panel"><h3>Navigation</h3><p class="muted">Vert : réponse enregistrée · ! : critique</p><div class="nav">${e.questions.map((q,i)=>`<button data-nav="${i}" class="${e.answers[q.id]?.length?'done':''} ${index===i?'current':''} ${CRITICAL.has(q.id)?'critical-nav':''}" title="${CRITICAL.has(q.id)?'Question critique':'Question '+(i+1)}">${i+1}${CRITICAL.has(q.id)?'!':''}</button>`).join('')}</div><p><button id="finish" style="width:100%;margin-top:15px">Terminer l’épreuve</button></p></aside></div>`);app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.id);let values=[...(state.exam.answers[q.id]||[])];values=values.includes(i)?values.filter(x=>x!==i):[...values,i];state.exam.answers[q.id]=values;render();queue=queue.then(()=>api('answer',{id:q.id,values})).then(s=>{if(!s.exam)update(s)}).catch(async e=>{error(e);try{update(await api('state'))}catch{}})});$('prev').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.nav);render()});$('finish').onclick=()=>{if(confirm('Terminer définitivement cette épreuve ? Les questions sans réponse seront comptées comme incorrectes.'))action('finish')};clock()}
function render(){document.body.classList.remove('final-v3');if(!config)return;if(!state)landing();else if(state.exam)exam();else dashboard();if(!state?.exam)$('timer').textContent=''}
async function action(p,d={}){if(busy)return;busy=true;try{await queue;update(await api(p,d))}catch(e){error(e)}finally{busy=false}}
function clock(){if(!state?.exam)return;let left=Math.max(0,Math.ceil(state.exam.end-(Date.now()+offset)/1000));$('timer').textContent=fmt(left);$('timer').className='clock '+(left<=60?'danger':left<=300?'warn':'');if(left===0&&!busy)action('state')}
setInterval(clock,250);async function init(){config=CONFIG;try{model=JSON.parse(localStorage.getItem(KEY)||'null');if(model){tick();update(publicState())}else render()}catch(e){app.textContent='Le stockage local est indisponible. Ouvrez le fichier dans Chrome ou Edge avec le stockage autorisé.'}}init();$('reset').onclick=()=>{if(confirm('Effacer le parcours local et recommencer le test ?')){localStorage.removeItem(KEY);location.reload()}};
</script></html>
