<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT | Formateur V4 — démonstration</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--panel:#142131;--edge:#2a4256;--cyan:#56d7f4;--muted:#a7bbce;--red:#fa8591;--green:#49d8a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf5fb;font:16px system-ui,sans-serif}header{padding:20px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--bg);z-index:2}header b{color:var(--cyan);letter-spacing:3px}main{max-width:1100px;margin:auto;padding:18px}.panel{padding:20px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;margin:12px 0}h1,h2,h3{margin:10px 0}p{line-height:1.5}.muted,small{color:var(--muted)}.notice{border-left:4px solid #efbb63;padding:12px;background:#242a30;color:#f2dcb6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}button,input,select,textarea{font:inherit;border:1px solid var(--edge);border-radius:8px;padding:10px;color:inherit;background:#0d1927}button{cursor:pointer;min-height:44px}button.primary{background:var(--cyan);color:#081722;font-weight:800}button:disabled{opacity:.4;cursor:not-allowed}label{display:block}select,textarea{width:100%;margin:6px 0}.metric{font-size:30px;font-weight:800;color:var(--cyan)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid var(--edge);text-align:left}th{color:var(--muted)}.critical{border-left:4px solid var(--red)}.bad{color:var(--red)}.good{color:var(--green)}canvas{background:white;width:100%;height:120px;touch-action:none;border:1px solid var(--edge);border-radius:6px}#report{display:none}@media print{@page{size:A4;margin:13mm}header,#dashboard,#detail,.notice{display:none!important}body{background:white;color:black}#report{display:block!important}main{padding:0}.panel{background:white;border:1px solid #bbb}td,th{border:1px solid #aaa;color:black}img{max-width:100%}h2,h3{break-after:avoid}tr{break-inside:avoid}}</style>
<header><b>BLACKOUT / HABILITATION V4</b><br><small>ESPACE FORMATEUR — PROTOTYPE NON AUTHENTIFIÉ</small></header>
<main><p class="notice">Démonstration : uniquement des données fictives. Aucune donnée n'est envoyée sur Drive. Les critères pratiques sont des exemples, non des grilles PROMEO. Les signatures de test n'ont aucune valeur administrative.</p><section id="dashboard"></section><section id="detail"></section><section id="report"></section></main>
<script src="core.js"></script>
<script>
"use strict";
const C=BlackoutCore, esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const mkResult=(p,passed)=>({profile:p,good:passed?18:12,total:20,score:passed?90:60,passed,critical:passed?[]:["EX-02"],details:[{question:"Question fictive 1 (démonstration)",selected:["Réponse exemple"],expected:["Réponse exemple"],ok:true,critical:false},{question:"Question fictive 2 (démonstration)",selected:["Choix A"],expected:[passed?"Choix A":"Choix B"],ok:passed,critical:!passed}],date:"2026-11-26"});
function dossier(i,classe,profiles,done){let d={caseId:"DEMO-"+i,campaignId:"DEMO-2026",identity:{nom:"EXEMPLE "+i,prenom:"Apprenti",classe},profiles,theory:{},practice:{},opinions:{},signatures:{},revision:0,closed:false};if(done)d=C.attachTheory(d,{caseId:d.caseId,campaignId:d.campaignId,results:Object.fromEntries(profiles.map(p=>[p,mkResult(p,i!==3)]))});return d;}
const initial=()=>[dossier(1,"BTS ET",["BR","BC"],true),dossier(2,"BTS ATI",["BS"],false),dossier(3,"BTS ET",["BR"],true)];
let dossiers=initial(),selected=null,filter="Tous";
const $=id=>document.getElementById(id);
function dashboard(){const list=dossiers.filter(d=>filter==="Tous"||d.identity.classe===filter);$("dashboard").innerHTML='<h1>Suivi des campagnes</h1><p class="muted">Campagne de démonstration · dossiers persistants prévus côté serveur</p><div class="grid">'+["Théorie en attente","Pratique en attente","À valider / signer","Clôturé"].map(s=>'<div class="panel"><small>'+s+'</small><div class="metric">'+list.filter(d=>C.status(d)===s).length+'</div></div>').join("")+'</div><label>Classe<select id="classFilter">'+["Tous","BTS ET","BTS ATI"].map(c=>'<option'+(filter===c?' selected':'')+'>'+c+'</option>').join("")+'</select></label><div class="panel scroll"><table><thead><tr><th>Apprenti</th><th>Classe</th><th>Statut</th><th>Action</th></tr></thead><tbody>'+list.map(d=>'<tr><td>'+esc(d.identity.prenom+" "+d.identity.nom)+'</td><td>'+esc(d.identity.classe)+'</td><td>'+esc(C.status(d))+'</td><td><button data-open="'+esc(d.caseId)+'">Ouvrir</button></td></tr>').join("")+'</tbody></table></div><button id="reset">Réinitialiser les exemples</button>';$("classFilter").onchange=e=>{filter=e.target.value;dashboard()};$("dashboard").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{selected=b.dataset.open;detail();$("detail").scrollIntoView({behavior:"smooth"})});$("reset").onclick=()=>{dossiers=initial();selected=null;dashboard();detail()}}
function invalidate(d){d.signatures={};d.revision++;}function current(){return dossiers.find(d=>d.caseId===selected)}
function detail(){const d=current();if(!d){$("detail").innerHTML="";return}
 $("detail").innerHTML='<div class="panel"><div class="row"><h2>'+esc(d.identity.prenom+" "+d.identity.nom)+'</h2><span>'+esc(C.status(d))+'</span></div><p class="muted">'+esc(d.caseId+" · "+d.campaignId)+'</p><h3>Résultats théoriques</h3>'+d.profiles.map(p=>{let r=d.theory[p];return '<p><b>'+esc(p)+'</b> : '+(r?esc(r.score+" % · "+(r.passed?"Réussie":"Non réussie")+" · "+r.critical.length+" erreur(s) critique(s)"):"À passer")+'</p>'+(r?'<details><summary>Corrigé fictif</summary>'+r.details.map(q=>'<p>'+esc(q.question)+'<br>Donnée : '+esc(q.selected.join(", "))+'<br>Attendue : '+esc(q.expected.join(", "))+'</p>').join("")+'</details>':"")}).join("")+'</div>';
 for(const p of d.profiles){if(!d.practice[p])d.practice[p]={gridVersion:"DEMO-0",criteria:[{text:"Exemple A — analyser la situation",critical:false,mark:""},{text:"Exemple B — observer un geste de sécurité",critical:true,mark:""},{text:"Exemple C — rendre compte",critical:false,mark:""}],observations:""};const g=d.practice[p],s=C.summarize(d,p);const section=document.createElement("section");section.className="panel";section.innerHTML='<h2>Pratique — '+esc(p)+'</h2><p class="muted">Grille provisoire fictive · '+esc(g.gridVersion)+' · '+esc(s.practice)+'</p>'+g.criteria.map((c,i)=>'<div class="panel '+(c.critical?"critical":"")+'"><label>'+esc(c.text)+(c.critical?" · critique (exemple)":"")+'<select data-mark="'+i+'" '+(d.closed?"disabled":"")+'><option value="">Non renseigné</option>'+[["acquis","Acquis"],["partiel","Partiel"],["non_acquis","Non acquis"],["non_observe","Non observé"]].map(([v,l])=>'<option value="'+v+'" '+(c.mark===v?"selected":"")+'>'+l+'</option>').join("")+'</select></label></div>').join("")+'<label>Observations<textarea data-observation '+(d.closed?"disabled":"")+'>'+esc(g.observations)+'</textarea></label><label>Avis formateur<select data-opinion '+(d.closed?"disabled":"")+'><option value="">En attente</option><option value="favorable" '+(d.opinions[p]==="favorable"?"selected":"")+' '+(!s.canFavor?"disabled":"")+'>Favorable (démonstration)</option><option value="defavorable" '+(d.opinions[p]==="defavorable"?"selected":"")+'>Défavorable (démonstration)</option></select></label>';$("detail").append(section);
 section.querySelectorAll("[data-mark]").forEach(el=>el.onchange=()=>{g.criteria[Number(el.dataset.mark)].mark=el.value;delete d.opinions[p];invalidate(d);dashboard();detail()});section.querySelector("[data-observation]").onchange=e=>{g.observations=e.target.value;invalidate(d);dashboard();detail()};section.querySelector("[data-opinion]").onchange=e=>{d.opinions[p]=e.target.value;invalidate(d);dashboard();detail()};}
 const box=document.createElement("section");box.className="panel";const can=C.reviewAllowed(d);
 box.innerHTML='<h2>Clôture et signatures de démonstration</h2><p>'+(can?"Synthèse prête pour le visa de test.":"Compléter théorie, critères et avis avant de signer.")+'</p><div class="grid">'+["learner","trainer"].map(role=>'<div><h3>'+(role==="learner"?"Apprenti":"Formateur")+'</h3><canvas id="pad-'+role+'" width="600" height="150"></canvas><p><button data-clear="'+role+'" '+(!can||d.closed?"disabled":"")+'>Effacer</button></p></div>').join("")+'</div><div class="row"><button class="primary" id="close" '+(!can||d.closed?"disabled":"")+'>Clôturer la démonstration</button><button id="print" '+(!d.closed?"disabled":"")+'>Imprimer le bilan fictif / PDF</button></div><p class="muted">Aucun envoi automatique dans cette version.</p>';$("detail").append(box);
 for(const role of ["learner","trainer"]){const pad=$("pad-"+role),ctx=pad.getContext("2d");ctx.strokeStyle="#17334d";ctx.lineWidth=3;ctx.lineCap="round";if(d.signatures[role]){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=d.signatures[role].image}let active=false,moved=false;function xy(e){const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]}pad.onpointerdown=e=>{if(!can||d.closed)return;active=true;moved=false;pad.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...xy(e));};pad.onpointermove=e=>{if(!active)return;moved=true;ctx.lineTo(...xy(e));ctx.stroke()};function finish(){if(active&&moved)d.signatures[role]={image:pad.toDataURL("image/png"),at:new Date().toISOString(),revision:d.revision};active=false}pad.onpointerup=finish;pad.onpointercancel=finish;box.querySelector('[data-clear="'+role+'"]').onclick=()=>{delete d.signatures[role];ctx.clearRect(0,0,pad.width,pad.height)};}
 $("close").onclick=()=>{if(!C.reviewAllowed(d)||!["learner","trainer"].every(r=>d.signatures[r]?.revision===d.revision)){alert("Les deux signatures de démonstration sont nécessaires.");return}d.closed=true;d.closedAt=new Date().toISOString();dashboard();detail()};$("print").onclick=()=>{report(d);window.print()};
}
function report(d){$("report").innerHTML='<h1>Bilan habilitation — DÉMONSTRATION</h1><p>Document fictif, non administratif · '+esc(d.caseId)+'</p><p>'+esc(d.identity.prenom+" "+d.identity.nom+" · "+d.identity.classe)+'</p><table><tr><th>Symbole</th><th>Théorie</th><th>Pratique</th><th>Avis</th></tr>'+d.profiles.map(p=>{let s=C.summarize(d,p);return '<tr><td>'+esc(p)+'</td><td>'+esc(s.theory)+'</td><td>'+esc(s.practice)+'</td><td>'+esc(d.opinions[p])+'</td></tr>'}).join("")+'</table>'+d.profiles.map(p=>'<h2>'+esc(p)+'</h2><h3>Correction théorique</h3>'+d.theory[p].details.map(q=>'<p>'+esc(q.question)+' — donnée : '+esc(q.selected.join(", "))+' — attendue : '+esc(q.expected.join(", "))+'</p>').join("")+'<h3>Pratique (grille fictive)</h3>'+d.practice[p].criteria.map(c=>'<p>'+esc(c.text)+' : '+esc(c.mark)+'</p>').join("")+'<p>Observations : '+esc(d.practice[p].observations)+'</p>').join("")+'<h2>Signatures de test</h2>'+["learner","trainer"].map(r=>'<p>'+esc(r==="learner"?"Apprenti":"Formateur")+' · '+esc(d.signatures[r].at)+'</p><img width="260" src="'+esc(d.signatures[r].image)+'">').join("")+'<p>Clôturé le '+esc(d.closedAt)+'. Ne constitue pas un titre d’habilitation.</p>';}
dashboard();detail();
</script></html>
